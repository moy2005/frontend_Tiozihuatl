<section class="login-page min-h-screen flex items-center justify-center px-4 py-16 pt-32" role="main" aria-label="Formulario de login">

  <!-- El resto del HTML permanece exactamente igual -->
  <div class="w-full max-w-xl">
    <div class="login-container">
      <!-- HEADER -->
      <div class="flex flex-col items-center mb-6 text-center">
        <div class="w-24 h-24 flex items-center justify-center">
          <img src="https://res.cloudinary.com/dazzy4wzq/image/upload/v1763396639/logo1_mgnz23.png" 
               class="w-60 h-60 object-contain drop-shadow-lg" 
               alt="Logo Instituto"
               loading="lazy" />
        </div>
        <h1 class="mt-5 text-3xl font-bold login-title">
          Iniciar Sesión
        </h1>
      </div>

      <!-- CONTENEDOR INTERNO -->
      <div class="login-inner">
        <!-- ANIMATED CONTAINER -->
        <div
          class="transition-all duration-300"
          [class.opacity-0]="transitioning"
          [class.translate-y-5]="transitioning">
          
          <!-- LOGIN NORMAL -->
          <form (ngSubmit)="loginPassword()" class="space-y-5" *ngIf="!smsMode">
            <!-- Campo Matrícula/Correo -->
            <div>
              <label class="label-text">Matrícula</label>
              <div class="input-wrapper">
                <input
                  type="email"
                  [(ngModel)]="correo"
                  name="correo"
                  required
                  (keydown)="bloquearCaracteresPeligrosos($event)"
                  (input)="correo = sanitizeInput(correo)"
                  class="input-field w-full"
                  placeholder="Ejemplo: 2025001234" />
                <ion-icon name="id-card-outline" class="input-icon"></ion-icon>
              </div>
              <!-- Mensaje para visitantes -->
              <p class="info-visitantes flex items-start gap-2">
                <ion-icon name="information-circle" class="mt-0.5 text-lg"></ion-icon>
                <span>Los visitantes deben ingresar su correo electrónico en este campo en lugar de matrícula</span>
              </p>
            </div>

            <!-- Campo contraseña -->
            <div>
              <label class="label-text">Contraseña</label>
              <div class="input-wrapper">
                <input
                  #passwordInput
                  type="password"
                  [(ngModel)]="contrasena"
                  name="contrasena"
                  maxlength="8"
                  minlength="8"
                  required
                  (keydown)="bloquearCaracteresPeligrosos($event)"
                  (input)="contrasena = sanitizeInput(contrasena)"
                  class="input-field w-full pr-14"
                  placeholder="••••••••" />
                <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
                <button 
                  type="button" 
                  (click)="togglePassword(passwordInput)"
                  class="input-validation">
                  <ion-icon [name]="passwordInput.type === 'password' ? 'eye-outline' : 'eye-off-outline'" class="text-xl text-gray-500"></ion-icon>
                </button>
              </div>
            </div>

            <!-- Selección de Rol -->
            <div>
              <label class="label-text">Rol de Usuario</label>
              <div class="input-wrapper">
                <select
                  [(ngModel)]="rolSeleccionado"
                  name="rolSeleccionado"
                  required
                  class="input-field w-full pr-12">
                  <option value="" disabled selected>Selecciona un rol</option>
                  <option value="Administrador">Administrador</option>
                  <option value="Docente">Docente</option>
                  <option value="Alumno">Alumno</option>
                  <option value="Bibliotecario">Bibliotecario</option>
                  <option value="Visitante">Visitante</option>
                </select>
                <ion-icon name="people-outline" class="input-icon"></ion-icon>
              </div>
            </div>

            <button
              type="submit"
              [disabled]="cargando"
              class="btn-primary flex items-center justify-center gap-2">
              <ng-container *ngIf="!cargando; else loading">
                <ion-icon name="log-in-outline" class="text-xl"></ion-icon>
                <span>Iniciar Sesión</span>
              </ng-container>
              <ng-template #loading>
                <ion-icon name="sync-outline" class="animate-spin"></ion-icon> Cargando...
              </ng-template>
            </button>

            <!-- Enlace a login por SMS -->
            <button
              type="button"
              (click)="cambiarModoSMS(true)"
              class="w-full text-center text-sm mt-3">
              <span class="link-acento flex items-center justify-center gap-2">
                <ion-icon name="chatbubble-outline"></ion-icon> Iniciar sesión por SMS
              </span>
            </button>
          </form>

          <!-- LOGIN POR SMS -->
          <div *ngIf="smsMode" class="space-y-4">
            <div *ngIf="!otpEnviado; else otpStep">
              <label class="label-text">Número de teléfono</label>
              <div class="input-wrapper">
                <input
                  type="tel"
                  [(ngModel)]="telefono"
                  name="telefono"
                  maxlength="10"
                  required
                  (keydown)="bloquearCaracteresPeligrosos($event)"
                  (input)="telefono = sanitizeInput(telefono)"
                  class="input-field w-full"
                  placeholder="Ejemplo: 7711813520" />
                <ion-icon name="call-outline" class="input-icon"></ion-icon>
              </div>

              <button
                (click)="enviarSMS()"
                [disabled]="cargando"
                class="btn-primary flex items-center justify-center gap-2 mt-4">
                <ng-container *ngIf="!cargando; else loading2">
                  <ion-icon name="paper-plane-outline"></ion-icon> Enviar código por SMS
                </ng-container>
                <ng-template #loading2>
                  <ion-icon name="sync-outline" class="animate-spin"></ion-icon> Enviando...
                </ng-template>
              </button>

              <button
                (click)="cambiarModoSMS(false)"
                class="w-full mt-3 text-center">
                <span class="link-acento flex items-center justify-center gap-2">
                  <ion-icon name="arrow-back-outline"></ion-icon> Volver al inicio de sesión normal
                </span>
              </button>
            </div>

            <ng-template #otpStep>
              <div>
                <p class="text-[#2C3A6A] text-center mb-4 font-medium">
                  Se envió un código al número <strong>{{ telefono }}</strong>
                </p>

                <label class="label-text text-center flex items-center justify-center gap-2 mb-3">
                  <ion-icon name="key-outline" class="text-sm"></ion-icon>
                  Ingresa el código de verificación
                </label>

                <!-- Contenedor clickeable para forzar foco -->
                <div class="flex justify-center cursor-text" (click)="focusOtp()">
                  <!-- Cajitas visuales -->
                  <div class="flex justify-center gap-2 mb-4 select-none">
                    <div
                      *ngFor="let i of [0,1,2,3,4,5]; let idx = index"
                      class="otp-box w-12 h-14 flex items-center justify-center rounded-xl border-2 border-gray-300
                             text-2xl font-bold bg-white shadow-sm"
                      [class.active]="otp.length === idx"
                      [class.filled]="otp[idx]"
                      [class.ring-2]="otp.length === idx"
                      [class.ring-indigo-500]="otp.length === idx">
                      <span class="text-[#3FA6E8]">{{ otp[idx] || '' }}</span>
                    </div>
                  </div>
                </div>

                <!-- Input accesible (oculto visualmente pero focusable) -->
                <input
                  #otpInput
                  type="tel"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  maxlength="6"
                  [value]="otp"
                  name="otp"
                  class="absolute w-px h-px opacity-0 -z-10"
                  (input)="onOtpInput($event)"
                  (paste)="onOtpPaste($event)"
                  [disabled]="cargando"
                  autofocus />

                <!-- Indicador de carga -->
                <div *ngIf="cargando" class="text-center py-3">
                  <ion-icon name="sync-outline" class="text-[#3FA6E8] text-3xl animate-spin"></ion-icon>
                  <p class="text-[#2C3A6A] mt-2 text-sm">Verificando código...</p>
                </div>

                <!-- Botón para volver atrás -->
                <button
                  (click)="otpEnviado = false; otp = ''"
                  [disabled]="cargando"
                  class="w-full mt-4 text-center">
                  <span class="link-acento flex items-center justify-center gap-2">
                    <ion-icon name="arrow-back-outline"></ion-icon> Volver atrás
                  </span>
                </button>
              </div>
            </ng-template>
          </div>
        </div>

        <!-- Separador -->
        <hr class="my-6 border-[#CBD8F7]" />

        <!-- OTROS MÉTODOS -->
        <div class="space-y-3">
          <button
            (click)="loginBiometria()"
            [disabled]="cargando"
            class="btn-secondary w-full flex justify-center items-center gap-2">
            <ion-icon name="finger-print-outline"></ion-icon> Usar biometría
          </button>

          <div class="grid grid-cols-2 gap-3">
            <button
              (click)="loginOAuth('google')"
              [disabled]="oauthLoading === 'google'"
              class="btn-secondary btn-google w-full flex justify-center items-center gap-2">
              <ion-icon name="logo-google"></ion-icon> Google
            </button>

           
          </div>
        </div>

        <!-- Link recuperación -->
        <p class="text-center text-sm text-[#2C3A6A] mt-4">
          <a (click)="irARecuperacionContrasena()" class="link-acento cursor-pointer">
            ¿Olvidaste tu contraseña?
          </a>
        </p>

        <!-- Link al registro -->
        <p class="mt-4 text-center text-[#2C3A6A] text-sm">
          ¿No perteneces a la institución?
          <a (click)="irARegistro()" class="link-acento cursor-pointer">
            Regístrate como visitante
          </a>
        </p>
      </div>
    </div>
  </div>
</section>
