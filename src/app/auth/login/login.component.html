<section class="login-page min-h-screen flex items-center justify-center px-4 py-16 pt-32" role="main" aria-label="Formulario de login">
  <style>
    /* ===== ESTILOS DEL DISEÑO AZUL ===== */
    :root {
      --form-azul: #3FA6E8;
      --form-azul-borde: #345EC8;
    }

    .login-page {
      --azul-fondo: #e0f2fe;
      --azul-contenedor: #3FA6E8;
      --azul-interior: #E7EEFF;
      --azul-input: #FFFFFF;
      --azul-boton: #3FA6E8;
      --azul-boton-hover: #1D3E8D;
      --texto-blanco: #FFFFFF;
      --texto-suave: rgba(255,255,255,0.85);
      --gris-placeholder: #B6C4E2;
      --gris-border: #D2DCF5;

      font-family: "Inter", sans-serif !important;
      background: var(--azul-fondo);
    }

    .login-page h1, 
    .login-page h2, 
    .login-page h3 {
      font-family: "Montserrat", sans-serif !important;
    }

    /* PANEL AZUL PRINCIPAL */
    .login-page .login-container {
      background: var(--azul-contenedor);
      border-radius: 24px;
      padding: 2.2rem;
      border: 1px solid #3FA6E8;
      box-shadow: 0 12px 28px rgba(47,77,160,0.25), 0 4px 14px rgba(0,0,0,0.08);
    }

    /* PANEL INTERIOR */
    .login-page .login-inner {
      background: var(--azul-interior);
      padding: 2rem;
      border-radius: 18px;
      border: 1px solid #CBD8F7;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.4);
    }

    /* TITULO */
    .login-page .login-title {
      color: var(--texto-blanco);
    }

    .login-page .login-sub {
      color: var(--texto-suave);
      font-size: 0.9rem;
    }

    /* INPUTS */
    .login-page .input-wrapper {
      position: relative;
    }

    .login-page .input-field {
      background: var(--azul-input);
      border: 1px solid var(--gris-border);
      border-radius: 12px;
      padding-left: 3rem;
      padding-top: 0.9rem;
      padding-bottom: 0.9rem;
      font-size: 0.9rem;
      color: #374151;
      transition: 0.25s ease;
    }

    .login-page .input-field:focus {
      border-color: var(--azul-contenedor);
      box-shadow: 0 0 0 3px rgba(63,111,213,0.25);
      background: white;
      outline: none;
    }

    .login-page .input-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-52%);
      font-size: 1.15rem;
      color: #7A8CC5;
      pointer-events: none;
    }

    .login-page .input-validation {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-52%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* BOTÓN PRINCIPAL */
    .login-page .btn-primary {
      background: var(--azul-boton);
      color: white;
      font-weight: 600;
      width: 100%;
      padding: 1rem;
      border-radius: 14px;
      font-size: 1rem;
      transition: 0.25s ease;
      box-shadow: 0 6px 16px rgba(36,74,166,0.35);
      border: none;
      cursor: pointer;
    }

    .login-page .btn-primary:hover:not(:disabled) {
      background: var(--azul-boton-hover);
      transform: translateY(-2px);
    }

    .login-page .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* BOTONES SECUNDARIOS */
    .login-page .btn-secondary {
      background: #2D8BE8;
      color: white;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      transition: 0.25s ease;
      border: none;
      cursor: pointer;
    }

    .login-page .btn-secondary:hover:not(:disabled) {
      background: #1D6BC8;
      transform: translateY(-1px);
    }

    .login-page .btn-google {
      background: #dc2626;
    }

    .login-page .btn-google:hover:not(:disabled) {
      background: #b91c1c;
    }

    .login-page .btn-facebook {
      background: #1e3a8a;
    }

    .login-page .btn-facebook:hover:not(:disabled) {
      background: #1e40af;
    }

    /* LABELS */
    .login-page .label-text {
      color: #2C3A6A;
      font-weight: 600;
      font-size: 0.85rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* LINKS */
    .login-page .link-acento {
      color: var(--azul-boton);
      font-weight: 600;
      cursor: pointer;
    }

    .login-page .link-acento:hover {
      text-decoration: underline;
    }

    /* ERROR */
    .login-page .error-message {
      background: #FFDCDC;
      border: 1px solid #FFB3B3;
      padding: 0.85rem;
      border-radius: 10px;
      display: none;
    }

    .login-page .error-message.show {
      display: flex;
    }

    /* CAJITAS OTP */
    .otp-box {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .otp-box.active {
      transform: scale(1.05);
      border-color: var(--azul-boton);
      box-shadow: 0 0 0 3px rgba(63, 166, 232, 0.2);
    }
    .otp-box.filled {
      background: linear-gradient(135deg, rgba(63, 166, 232, 0.1), rgba(29, 62, 141, 0.1));
    }

    /* MENSAJE INFO VISITANTES */
    .login-page .info-visitantes {
      background: #FFF3CD;
      border: 1px solid #FFE69C;
      color: #664D03;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    /* OCULTAR OJO AUTOMÁTICO DEL NAVEGADOR */
    .login-page .input-field::-ms-reveal,
    .login-page .input-field::-ms-clear {
      display: none;
    }
    
    .login-page .input-field::-webkit-credentials-auto-fill-button,
    .login-page .input-field::-webkit-contacts-auto-fill-button {
      visibility: hidden;
      pointer-events: none;
      position: absolute;
    }
  </style>

  <div class="w-full max-w-xl">
    <div class="login-container">
      <!-- HEADER -->
      <div class="flex flex-col items-center mb-6 text-center">
        <div class="w-24 h-24 flex items-center justify-center">
          <img src="https://res.cloudinary.com/dazzy4wzq/image/upload/v1763396639/logo1_mgnz23.png" class="w-60 h-60 object-contain drop-shadow-lg" alt="Logo Instituto" />
        </div>
        <h1 class="mt-5 text-3xl font-bold login-title">
          Iniciar Sesión
        </h1>
      </div>

      <!-- CONTENEDOR INTERNO -->
      <div class="login-inner">
        <!-- ANIMATED CONTAINER -->
        <div
          class="transition-all duration-300"
          [class.opacity-0]="transitioning"
          [class.translate-y-5]="transitioning">
          
          <!-- LOGIN NORMAL -->
          <form (ngSubmit)="loginPassword()" class="space-y-5" *ngIf="!smsMode">
            <!-- Campo Matrícula/Correo -->
            <div>
              <label class="label-text">Matrícula</label>
              <div class="input-wrapper">
                <input
                  type="email"
                  [(ngModel)]="correo"
                  name="correo"
                  required
                  class="input-field w-full"
                  placeholder="Ejemplo: 2025001234" />
                <ion-icon name="id-card-outline" class="input-icon"></ion-icon>
              </div>
              <!-- Mensaje para visitantes -->
              <p class="info-visitantes flex items-start gap-2">
                <ion-icon name="information-circle" class="mt-0.5 text-lg"></ion-icon>
                <span>Los visitantes deben ingresar su correo electrónico en este campo en lugar de matrícula</span>
              </p>
            </div>

            <!-- Campo contraseña -->
            <div>
              <label class="label-text">Contraseña</label>
              <div class="input-wrapper">
                <input
                  #passwordInput
                  type="password"
                  [(ngModel)]="contrasena"
                  name="contrasena"
                  required
                  class="input-field w-full pr-14"
                  placeholder="••••••••" />
                <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
                <button 
                  type="button" 
                  (click)="togglePassword(passwordInput)"
                  class="input-validation">
                  <ion-icon [name]="passwordInput.type === 'password' ? 'eye-outline' : 'eye-off-outline'" class="text-xl text-gray-500"></ion-icon>
                </button>
              </div>
            </div>

            <!-- Selección de Rol -->
            <div>
              <label class="label-text">Rol de Usuario</label>
              <div class="input-wrapper">
                <select
                  [(ngModel)]="rolSeleccionado"
                  name="rolSeleccionado"
                  required
                  class="input-field w-full pr-12">
                  <option value="" disabled selected>Selecciona un rol</option>
                  <option value="Administrador">Administrador</option>
                  <option value="Docente">Docente</option>
                  <option value="Alumno">Alumno</option>
                  <option value="Bibliotecario">Bibliotecario</option>
                  <option value="Visitante">Visitante</option>
                </select>
                <ion-icon name="people-outline" class="input-icon"></ion-icon>
              </div>
            </div>

            <button
              type="submit"
              [disabled]="cargando"
              class="btn-primary flex items-center justify-center gap-2">
              <ng-container *ngIf="!cargando; else loading">
                <ion-icon name="log-in-outline" class="text-xl"></ion-icon>
                <span>Iniciar Sesión</span>
              </ng-container>
              <ng-template #loading>
                <ion-icon name="sync-outline" class="animate-spin"></ion-icon> Cargando...
              </ng-template>
            </button>

            <!-- Enlace a login por SMS -->
            <button
              type="button"
              (click)="cambiarModoSMS(true)"
              class="w-full text-center text-sm mt-3">
              <span class="link-acento flex items-center justify-center gap-2">
                <ion-icon name="chatbubble-outline"></ion-icon> Iniciar sesión por SMS
              </span>
            </button>
          </form>

          <!-- LOGIN POR SMS -->
          <div *ngIf="smsMode" class="space-y-4">
            <div *ngIf="!otpEnviado; else otpStep">
              <label class="label-text">Número de teléfono</label>
              <div class="input-wrapper">
                <input
                  type="tel"
                  [(ngModel)]="telefono"
                  name="telefono"
                  maxlength="10"
                  required
                  class="input-field w-full"
                  placeholder="Ejemplo: 7711813520" />
                <ion-icon name="call-outline" class="input-icon"></ion-icon>
              </div>

              <button
                (click)="enviarSMS()"
                [disabled]="cargando"
                class="btn-primary flex items-center justify-center gap-2 mt-4">
                <ng-container *ngIf="!cargando; else loading2">
                  <ion-icon name="paper-plane-outline"></ion-icon> Enviar código por SMS
                </ng-container>
                <ng-template #loading2>
                  <ion-icon name="sync-outline" class="animate-spin"></ion-icon> Enviando...
                </ng-template>
              </button>

              <button
                (click)="cambiarModoSMS(false)"
                class="w-full mt-3 text-center">
                <span class="link-acento flex items-center justify-center gap-2">
                  <ion-icon name="arrow-back-outline"></ion-icon> Volver al inicio de sesión normal
                </span>
              </button>
            </div>

            <ng-template #otpStep>
              <div>
                <p class="text-[#2C3A6A] text-center mb-4 font-medium">
                  Se envió un código al número <strong>{{ telefono }}</strong>
                </p>

                <label class="label-text text-center flex items-center justify-center gap-2 mb-3">
                  <ion-icon name="key-outline" class="text-sm"></ion-icon>
                  Ingresa el código de verificación
                </label>

                <!-- Contenedor clickeable para forzar foco -->
                <div class="flex justify-center cursor-text" (click)="focusOtp()">
                  <!-- Cajitas visuales -->
                  <div class="flex justify-center gap-2 mb-4 select-none">
                    <div
                      *ngFor="let i of [0,1,2,3,4,5]; let idx = index"
                      class="otp-box w-12 h-14 flex items-center justify-center rounded-xl border-2 border-gray-300
                             text-2xl font-bold bg-white shadow-sm"
                      [class.active]="otp.length === idx"
                      [class.filled]="otp[idx]"
                      [class.ring-2]="otp.length === idx"
                      [class.ring-indigo-500]="otp.length === idx">
                      <span class="text-[#3FA6E8]">{{ otp[idx] || '' }}</span>
                    </div>
                  </div>
                </div>

                <!-- Input accesible (oculto visualmente pero focusable) -->
                <input
                  #otpInput
                  type="tel"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  maxlength="6"
                  [value]="otp"
                  name="otp"
                  class="absolute w-px h-px opacity-0 -z-10"
                  (input)="onOtpInput($event)"
                  (paste)="onOtpPaste($event)"
                  [disabled]="cargando"
                  autofocus />

                <!-- Indicador de carga -->
                <div *ngIf="cargando" class="text-center py-3">
                  <ion-icon name="sync-outline" class="text-[#3FA6E8] text-3xl animate-spin"></ion-icon>
                  <p class="text-[#2C3A6A] mt-2 text-sm">Verificando código...</p>
                </div>

                <!-- Botón para volver atrás -->
                <button
                  (click)="otpEnviado = false; otp = ''"
                  [disabled]="cargando"
                  class="w-full mt-4 text-center">
                  <span class="link-acento flex items-center justify-center gap-2">
                    <ion-icon name="arrow-back-outline"></ion-icon> Volver atrás
                  </span>
                </button>
              </div>
            </ng-template>
          </div>
        </div>

        <!-- Separador -->
        <hr class="my-6 border-[#CBD8F7]" />

        <!-- OTROS MÉTODOS -->
        <div class="space-y-3">
          <button
            (click)="loginBiometria()"
            [disabled]="cargando"
            class="btn-secondary w-full flex justify-center items-center gap-2">
            <ion-icon name="finger-print-outline"></ion-icon> Usar biometría
          </button>

          <div class="grid grid-cols-2 gap-3">
            <button
              (click)="loginOAuth('google')"
              [disabled]="oauthLoading === 'google'"
              class="btn-secondary btn-google w-full flex justify-center items-center gap-2">
              <ion-icon name="logo-google"></ion-icon> Google
            </button>

            <button
              (click)="loginOAuth('facebook')"
              [disabled]="oauthLoading === 'facebook'"
              class="btn-secondary btn-facebook w-full flex justify-center items-center gap-2">
              <ion-icon name="logo-facebook"></ion-icon> Facebook
            </button>
          </div>
        </div>

        <!-- Link recuperación -->
        <p class="text-center text-sm text-[#2C3A6A] mt-4">
          <a (click)="irARecuperacionContrasena()" class="link-acento cursor-pointer">
            ¿Olvidaste tu contraseña?
          </a>
        </p>

        <!-- Link al registro -->
        <p class="mt-4 text-center text-[#2C3A6A] text-sm">
          ¿No perteneces a la institución?
          <a (click)="irARegistro()" class="link-acento cursor-pointer">
            Regístrate como visitante
          </a>
        </p>
      </div>
    </div>
  </div>
</section>
