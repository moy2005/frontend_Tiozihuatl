<section class="recuperacion-page min-h-screen flex items-center justify-center px-4 py-16 pt-32" role="main" aria-label="Formulario de recuperación de contraseña">
  <style>
    /* ===== ESTILOS DEL DISEÑO AZUL ===== */
    :root {
      --form-azul: #3FA6E8;
      --form-azul-borde: #345EC8;
    }

    .recuperacion-page {
      --azul-fondo: #e0f2fe;
      --azul-contenedor: #3FA6E8;
      --azul-interior: #E7EEFF;
      --azul-input: #FFFFFF;
      --azul-boton: #3FA6E8;
      --azul-boton-hover: #1D3E8D;
      --texto-blanco: #FFFFFF;
      --texto-suave: rgba(255,255,255,0.85);
      --gris-placeholder: #B6C4E2;
      --gris-border: #D2DCF5;

      font-family: "Inter", sans-serif !important;
      background: var(--azul-fondo);
    }

    .recuperacion-page h1, 
    .recuperacion-page h2, 
    .recuperacion-page h3 {
      font-family: "Montserrat", sans-serif !important;
    }

    /* PANEL AZUL PRINCIPAL */
    .recuperacion-page .recuperacion-container {
      background: var(--azul-contenedor);
      border-radius: 24px;
      padding: 2.2rem;
      border: 1px solid #3FA6E8;
      box-shadow: 0 12px 28px rgba(47,77,160,0.25), 0 4px 14px rgba(0,0,0,0.08);
    }

    /* PANEL INTERIOR */
    .recuperacion-page .recuperacion-inner {
      background: var(--azul-interior);
      padding: 2rem;
      border-radius: 18px;
      border: 1px solid #CBD8F7;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.4);
    }

    /* TITULO */
    .recuperacion-page .recuperacion-title {
      color: var(--texto-blanco);
    }

    .recuperacion-page .recuperacion-sub {
      color: var(--texto-suave);
      font-size: 0.9rem;
    }

    /* INPUTS */
    .recuperacion-page .input-wrapper {
      position: relative;
    }

    .recuperacion-page .input-field {
      background: var(--azul-input);
      border: 1px solid var(--gris-border);
      border-radius: 12px;
      padding-left: 3rem;
      padding-top: 0.9rem;
      padding-bottom: 0.9rem;
      font-size: 0.9rem;
      color: #374151;
      transition: 0.25s ease;
    }

    .recuperacion-page .input-field:focus {
      border-color: var(--azul-contenedor);
      box-shadow: 0 0 0 3px rgba(63,111,213,0.25);
      background: white;
      outline: none;
    }

    .recuperacion-page .input-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-52%);
      font-size: 1.15rem;
      color: #7A8CC5;
      pointer-events: none;
    }

    .recuperacion-page .input-validation {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-52%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* BOTÓN PRINCIPAL */
    .recuperacion-page .btn-primary {
      background: var(--azul-boton);
      color: white;
      font-weight: 600;
      width: 100%;
      padding: 1rem;
      border-radius: 14px;
      font-size: 1rem;
      transition: 0.25s ease;
      box-shadow: 0 6px 16px rgba(36,74,166,0.35);
      border: none;
      cursor: pointer;
    }

    .recuperacion-page .btn-primary:hover:not(:disabled) {
      background: var(--azul-boton-hover);
      transform: translateY(-2px);
    }

    .recuperacion-page .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* BOTÓN VERDE PARA RESTABLECER */
    .recuperacion-page .btn-success {
      background: #10b981;
      color: white;
      font-weight: 600;
      width: 100%;
      padding: 1rem;
      border-radius: 14px;
      font-size: 1rem;
      transition: 0.25s ease;
      box-shadow: 0 6px 16px rgba(16,185,129,0.35);
      border: none;
      cursor: pointer;
    }

    .recuperacion-page .btn-success:hover:not(:disabled) {
      background: #059669;
      transform: translateY(-2px);
    }

    .recuperacion-page .btn-success:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* LABELS */
    .recuperacion-page .label-text {
      color: #2C3A6A;
      font-weight: 600;
      font-size: 0.85rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* LINKS */
    .recuperacion-page .link-acento {
      color: var(--azul-boton);
      font-weight: 600;
      cursor: pointer;
    }

    .recuperacion-page .link-acento:hover {
      text-decoration: underline;
    }

    /* MENSAJE INFO */
    .recuperacion-page .info-box {
      background: #E0F2FE;
      border: 1px solid #BAE6FD;
      color: #0C4A6E;
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }

    /* ICONO HEADER */
    .recuperacion-page .icon-header {
      width: 4rem;
      height: 4rem;
      background: linear-gradient(135deg, #3FA6E8, #2D8BE8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(63,166,232,0.3);
    }

    /* OCULTAR OJO AUTOMÁTICO DEL NAVEGADOR */
    .recuperacion-page .input-field::-ms-reveal,
    .recuperacion-page .input-field::-ms-clear {
      display: none;
    }
    
    .recuperacion-page .input-field::-webkit-credentials-auto-fill-button,
    .recuperacion-page .input-field::-webkit-contacts-auto-fill-button {
      visibility: hidden;
      pointer-events: none;
      position: absolute;
    }
  </style>

  <div class="w-full max-w-xl">
    <div class="recuperacion-container">
      <!-- HEADER -->
      <div class="flex flex-col items-center mb-6 text-center">
        <div class="icon-header mb-4">
          <ion-icon name="key-outline" class="text-4xl text-white"></ion-icon>
        </div>
        <h1 class="text-3xl font-bold recuperacion-title">
          Recuperar contraseña
        </h1>
        <p class="recuperacion-sub mt-2">
          Ingresa tu correo electrónico para recibir el código de recuperación
        </p>
      </div>

      <!-- CONTENEDOR INTERNO -->
      <div class="recuperacion-inner">
        
        <!-- FORMULARIO: ENVIAR CORREO -->
        <form *ngIf="!modoRecuperacion" (ngSubmit)="enviarCorreo()" class="space-y-5">
          
          <!-- Campo Correo -->
          <div>
            <label class="label-text flex items-center gap-2">
              <ion-icon name="mail-outline" class="text-sm"></ion-icon>
              Correo electrónico
            </label>
            <div class="input-wrapper">
              <input
                type="email"
                [(ngModel)]="correo"
                name="correo"
                required
                class="input-field w-full"
                placeholder="correo@ejemplo.com" />
              <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            </div>
            
            <!-- Mensaje informativo -->
            <div class="info-box flex items-start gap-2">
              <ion-icon name="information-circle-outline" class="mt-0.5 text-lg"></ion-icon>
              <span>Recibirás un código de 6 dígitos para restablecer tu contraseña</span>
            </div>
          </div>

          <!-- Botón Enviar -->
          <button
            type="submit"
            [disabled]="cargando"
            class="btn-primary flex items-center justify-center gap-2">
            <ng-container *ngIf="!cargando; else loading">
              <ion-icon name="paper-plane-outline" class="text-xl"></ion-icon>
              <span>Enviar enlace de recuperación</span>
            </ng-container>
            <ng-template #loading>
              <ion-icon name="sync-outline" class="animate-spin text-xl"></ion-icon>
              <span>Enviando...</span>
            </ng-template>
          </button>
        </form>

        <!-- FORMULARIO: RESTABLECER CONTRASEÑA -->
        <form *ngIf="modoRecuperacion" (ngSubmit)="restablecerContrasena()" class="space-y-5">
          
          <!-- Campo Código -->
          <div>
            <label class="label-text flex items-center gap-2">
              <ion-icon name="shield-checkmark-outline" class="text-sm"></ion-icon>
              Código de verificación
            </label>
            <div class="input-wrapper">
              <input
                type="text"
                [(ngModel)]="codigo"
                name="codigo"
                required
                maxlength="6"
                class="input-field w-full"
                placeholder="Ingresa el código de 6 dígitos" />
              <ion-icon name="shield-checkmark-outline" class="input-icon"></ion-icon>
            </div>
            
            <!-- Mensaje informativo -->
            <div class="info-box flex items-start gap-2">
              <ion-icon name="information-circle-outline" class="mt-0.5 text-lg"></ion-icon>
              <span>Revisa tu bandeja de entrada o correo no deseado</span>
            </div>
          </div>

          <!-- Campo Nueva Contraseña -->
          <div>
            <label class="label-text flex items-center gap-2">
              <ion-icon name="lock-closed-outline" class="text-sm"></ion-icon>
              Nueva contraseña
            </label>
            <div class="input-wrapper">
              <input
                #passwordInput
                type="password"
                [(ngModel)]="nuevaContrasena"
                name="nuevaContrasena"
                required
                minlength="6"
                class="input-field w-full pr-14"
                placeholder="Mínimo 6 caracteres" />
              <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
              <button 
                type="button" 
                (click)="passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password'"
                class="input-validation">
                <ion-icon 
                  [name]="passwordInput.type === 'password' ? 'eye-outline' : 'eye-off-outline'" 
                  class="text-xl text-gray-500">
                </ion-icon>
              </button>
            </div>
          </div>

          <!-- Botón Restablecer -->
          <button
            type="submit"
            [disabled]="cargando"
            class="btn-success flex items-center justify-center gap-2">
            <ng-container *ngIf="!cargando; else loading2">
              <ion-icon name="checkmark-circle-outline" class="text-xl"></ion-icon>
              <span>Restablecer contraseña</span>
            </ng-container>
            <ng-template #loading2>
              <ion-icon name="sync-outline" class="animate-spin text-xl"></ion-icon>
              <span>Actualizando...</span>
            </ng-template>
          </button>
        </form>

        <!-- Link Volver -->
        <p class="text-center text-sm text-[#2C3A6A] mt-6">
          <a (click)="irALogin()" class="link-acento cursor-pointer flex items-center justify-center gap-2">
            <ion-icon name="arrow-back-outline"></ion-icon>
            Volver al inicio de sesión
          </a>
        </p>
      </div>
    </div>
  </div>
</section>
