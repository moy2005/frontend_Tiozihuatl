<!-- Mismo diseño que el detalle de evento (usa detalle-evento.css). -->
<div class="evento-detail-page noticia-detail-page">
  <nav class="breadcrumb-bar" aria-label="Ruta de navegación">
    <a routerLink="/inicio">Inicio</a>
    <span class="sep" aria-hidden="true">›</span>
    <a routerLink="/noticias">Noticias</a>
    <span class="sep" aria-hidden="true">›</span>
    <span class="current" aria-current="page">{{ noticia?.titulo || 'Detalle de la noticia' }}</span>
  </nav>

  <div *ngIf="cargando" class="detail-loading" role="status">
    <div class="loader" aria-hidden="true"></div>
    <p>Cargando detalle de la noticia…</p>
  </div>

  <div *ngIf="!cargando && noEncontrado" class="detail-empty">
    <i class="ph ph-newspaper" aria-hidden="true"></i>
    <h1>Noticia no disponible</h1>
    <p>La noticia solicitada ya no se encuentra publicada.</p>
    <a routerLink="/noticias" class="back-link">Volver a noticias <span aria-hidden="true">→</span></a>
  </div>

  <article *ngIf="!cargando && noticia" class="event-article" aria-labelledby="news-title">
    <header class="detail-hero">
      <h1 id="news-title" class="detail-title">{{ noticia.titulo }}</h1>
      <div class="hero-meta">
        <span class="hero-meta-item" *ngIf="noticia.fecha_publicacion">
          <i class="ph ph-calendar-blank" aria-hidden="true"></i>
          <time [attr.datetime]="noticia.fecha_publicacion">{{ formatearFecha(noticia.fecha_publicacion) }}</time>
        </span>
        <span class="hero-meta-item" *ngIf="noticia.categoria">
          <i class="ph ph-tag" aria-hidden="true"></i>
          {{ noticia.categoria }}
        </span>
      </div>
    </header>

    <div class="ed-description">
      <app-texto-enlazado [texto]="noticia.contenido"></app-texto-enlazado>
    </div>

    <div class="ed-gallery ed-gallery--single" *ngIf="noticia.imagen_url || noticia.video_url">
      <div class="ed-gallery-item noticia-media">
        <video *ngIf="noticia.video_url; else imagenNoticia" [src]="noticia.video_url" controls playsinline></video>
        <ng-template #imagenNoticia>
          <img [src]="noticia.imagen_url" [alt]="noticia.titulo" />
        </ng-template>
      </div>
    </div>
  </article>
</div>
