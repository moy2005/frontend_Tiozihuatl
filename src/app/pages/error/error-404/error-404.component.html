<main class="not-found" aria-labelledby="not-found-title">
  <div class="not-found-layout">
    <div class="not-found-code" aria-hidden="true">404</div>
    <div class="not-found-copy">
      <p class="not-found-eyebrow">Error 404</p>
      <h1 id="not-found-title">No encontramos esta página</h1>
      <p class="not-found-description">Es posible que el enlace haya cambiado o que la página ya no esté disponible. Puedes continuar explorando nuestro sitio.</p>
      <div class="not-found-actions">
        <a routerLink="/inicio" class="not-found-primary">Volver al inicio <span aria-hidden="true">→</span></a>
        <a routerLink="/eventos" class="not-found-secondary">Explorar eventos</a>
      </div>
      <button type="button" class="not-found-back" (click)="goBack()"><span aria-hidden="true">←</span> Volver atrás</button>
      <nav class="not-found-links" aria-label="Otras secciones útiles">
        <a routerLink="/about">Conoce nuestra institución</a>
        <a routerLink="/contactanos">Contáctanos</a>
      </nav>
    </div>
  </div>
</main>
