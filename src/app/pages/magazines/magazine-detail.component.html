<div class="mag-overlay" (click)="cerrarModal($event)">
  <div class="mag-modal" *ngIf="magazine">

    <button class="mag-close" (click)="goBack()">
      <i class="ph ph-x"></i>
    </button>

    <!-- PORTADA -->
    <div class="mag-cover">
      <div class="mag-cover-inner">
        <img
          *ngIf="magazine.pdf_public_id"
          [src]="getPdfCover(magazine.pdf_public_id)"
          [alt]="magazine.titulo"
          class="mag-cover-img">
        <div class="mag-cover-glow"></div>
      </div>
    </div>

    <!-- INFORMACIÓN -->
    <div class="mag-info">

      <h1 class="mag-titulo">{{ magazine.titulo }}</h1>

      <p class="mag-descripcion" *ngIf="magazine.descripcion">
        {{ magazine.descripcion }}
      </p>

      <div class="mag-precio">
        ${{ magazine.precio | number:'1.2-2' }}
        <span class="mag-precio-label">MXN</span>
      </div>

      <div class="mag-stock"
        [ngClass]="{
          'mag-stock--ok':  magazine.stock > 0,
          'mag-stock--out': magazine.stock === 0
        }">
        <i [class]="magazine.stock > 0 ? 'ph ph-check-circle' : 'ph ph-x-circle'"></i>
        {{ magazine.stock > 0 ? 'Disponible' : 'Agotado' }}
      </div>

      <div class="mag-actions">

        <button
          *ngIf="!hasPurchased"
          (click)="addToCart()"
          [disabled]="magazine.stock === 0"
          class="mag-btn mag-btn--cart"
          [class.mag-btn--disabled]="magazine.stock === 0">
          <i class="ph ph-shopping-cart"></i>
          {{ magazine.stock === 0 ? 'Sin stock' : 'Agregar al carrito' }}
        </button>

        <button
          *ngIf="hasPurchased"
          (click)="openReader()"
          class="mag-btn mag-btn--read">
          <i class="ph ph-book-open"></i>
          Ver revista
        </button>

      </div>


    </div>
  </div>
</div>

<!-- TOAST -->
<div class="mag-toast" [class.mag-toast--visible]="showAddedMessage">
  <i class="ph ph-check-circle"></i>
  Revista agregada al carrito
</div>
