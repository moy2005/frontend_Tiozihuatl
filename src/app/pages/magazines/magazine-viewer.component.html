

<!-- ══ BREADCRUMB ══ -->
<nav class="breadcrumb-bar">

  <!-- Inicio -->
  <a routerLink="/perfil" class="crumb-link">
    Inicio
  </a>

  <span class="sep">›</span>

  <!-- Perfil -->
  <a routerLink="/perfil" class="crumb-link">
    Perfil
  </a>

  <span class="sep">›</span>

  <!-- Revista actual -->
  <span class="crumb-current">
    {{ magazine?.titulo || 'Cargando...' }}
  </span>

</nav>
<!-- ══ TOOLBAR ══ -->
<div class="visor-toolbar">

  <!-- Grupo navegación -->
  <div class="toolbar-group">

    <button
      class="nav-btn"
      (click)="prevPage()"
      [disabled]="currentPage <= 1 || rendering">
      &#9664;
    </button>

    <span class="page-indicator">
      <ng-container *ngIf="totalPages > 0">
        Pág. {{ currentPage }} / {{ totalPages }}
      </ng-container>
      <ng-container *ngIf="totalPages === 0">
        Cargando…
      </ng-container>
    </span>

    <button
      class="nav-btn"
      (click)="nextPage()"
      [disabled]="currentPage >= totalPages || rendering">
      &#9654;
    </button>

  </div>

  <div class="divider"></div>

  <!-- Grupo zoom -->
  <div class="toolbar-group">

    <button class="toolbar-btn"
      (click)="zoomOut()"
      [disabled]="zoomLevel <= minZoom || rendering">
      &#8722;
    </button>

    <span class="zoom-label">
      {{ (zoomLevel * 100).toFixed(0) }}%
    </span>

    <button class="toolbar-btn"
      (click)="zoomIn()"
      [disabled]="zoomLevel >= maxZoom || rendering">
      &#43;
    </button>

  </div>

</div>


<!-- ══ PDF AREA ══ -->
<div class="pdf-wrapper">

  <div class="loading-state" *ngIf="loading && !errorMessage" aria-live="polite" aria-busy="true">
    <div class="reader-loader"></div>
    <p>{{ loadingMessage }}</p>
  </div>

  <div class="loading-state" *ngIf="!loading && errorMessage">
    <p>{{ errorMessage }}</p>
  </div>

  <div
    id="pdfContainer"
    [class.pdf-hidden]="loading || errorMessage">
  </div>

</div>


<!-- ══ NAV INFERIOR ══ -->
<div class="bottom-nav" *ngIf="totalPages > 0">

  <button
    class="nav-btn"
    (click)="prevPage()"
    [disabled]="currentPage <= 1 || rendering">
    &#9664;
  </button>

  <span class="page-info">
    {{ currentPage }} / {{ totalPages }}
  </span>

  <button
    class="nav-btn"
    (click)="nextPage()"
    [disabled]="currentPage >= totalPages || rendering">
    &#9654;
  </button>

</div>
