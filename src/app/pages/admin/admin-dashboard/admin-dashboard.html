<div class="dashboard-container">
  <!-- HEADER -->
  <header class="dashboard-header">
    <div class="header-left">
      <h1>Gestión Administrativa</h1>
    </div>
    <div class="search-box">
      <input type="text" placeholder="Buscar...">
    </div>
  </header>

  <!-- MAIN GRID -->
  <div class="dashboard-main-grid">
    <!-- BAR CHART -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">Registros Mensuales</h3>
        <div class="chart-legend">
          <div class="legend-item">
            <div class="legend-dot" style="background: #1E88E5;"></div>
            <span>Libros</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: #3FA6E8;"></div>
            <span>Revistas</span>
          </div>
        </div>
      </div>
      <div class="chart-canvas-wrapper">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <!-- MINI STATS -->
    <div class="stats-mini-grid">
      <div class="stat-mini-card">
        <div class="stat-label">Usuarios Activos</div>
        <div class="stat-value">1,248</div>
        <span class="stat-trend trend-up">↑ 12.5%</span>
      </div>

      <div class="stat-mini-card">
        <div class="stat-label">Ingresos</div>
        <div class="stat-value">$48.2K</div>
        <span class="stat-trend trend-up">↑ 8.3%</span>
      </div>

      <div class="stat-mini-card">
        <div class="stat-label">Tasa Conversión</div>
        <div class="stat-value">3.24%</div>
        <span class="stat-trend trend-down">↓ 2.1%</span>
      </div>

      <div class="stat-mini-card">
        <div class="stat-label">Engagement</div>
        <div class="stat-value">68.4%</div>
        <span class="stat-trend trend-up">↑ 5.7%</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM CHARTS -->
  <div class="bottom-charts">
    <!-- STATISTICS -->
    <div class="chart-card">
      <div class="chart-header">
        <h3 class="chart-title">Distribución de Usuarios</h3>
      </div>
      <div class="stats-charts-grid">
        <div class="mini-chart-wrapper">
          <canvas id="doughnutChart"></canvas>
        </div>
        <div class="mini-chart-wrapper">
          <canvas id="progressChart"></canvas>
        </div>
      </div>
    </div>

    <!-- INFOGRAPHIC -->
    <div class="infographic-card">
      <div class="infographic-header">Visitas de Contenido</div>
      <div class="infographic-chart-wrapper">
        <canvas id="areaChart"></canvas>
      </div>
    </div>
  </div>

  <!-- OVERVIEW -->
  <div class="overview-card">
    <div class="overview-header">
      <h3 class="overview-title">Actividad del Sistema (Últimos 14 días)</h3>
      <span class="time-label">Este mes</span>
    </div>
    <div class="overview-chart-wrapper">
      <canvas id="lineChart"></canvas>
    </div>
  </div>
</div>
