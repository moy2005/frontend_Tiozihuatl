<div class="admin-content">
  <div class="max-w-[95%] mx-auto">

    <!-- ===== HEADER ===== -->
    <div class="card-azul mb-4 sm:mb-6">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <h2 class="page-title">Gestión de Calendario</h2>
        </div>
      </div>
    </div>

    <!-- ===== TABLA ===== -->
    <div class="card-azul overflow-hidden">

      <div class="p-4 sm:p-6 border-b border-gray-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">
        <h3 class="text-lg sm:text-xl font-bold text-[#2C3A6A] flex items-center gap-2">
          <ion-icon name="calendar-outline" class="text-[#3FA6E8]"></ion-icon>
          Lista de Calendarios
        </h3>
        <button
          (click)="abrirModal()"
          class="btn-success w-full sm:w-auto flex items-center justify-center gap-2">
          <ion-icon name="add-circle-outline"></ion-icon>
          Nuevo Calendario
        </button>
      </div>

      <!-- Vista Desktop -->
      <div class="hidden lg:block overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="table-header">
            <tr>
              <th class="p-4 text-left font-semibold whitespace-nowrap min-w-[200px]">
                <ion-icon name="text-outline" class="mr-2"></ion-icon>Título
              </th>
              <th class="p-4 text-left font-semibold whitespace-nowrap min-w-[120px]">
                <ion-icon name="document-outline" class="mr-2"></ion-icon>Tipo
              </th>
              <th class="p-4 text-left font-semibold whitespace-nowrap min-w-[120px]">
                <ion-icon name="toggle-outline" class="mr-2"></ion-icon>Estado
              </th>
              <th class="p-4 text-center font-semibold whitespace-nowrap min-w-[260px]">
                <ion-icon name="settings-outline" class="mr-2"></ion-icon>Acciones
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of calendars" class="table-row border-b border-gray-200 transition-colors duration-150">

              <td class="p-4 text-gray-800 font-medium">{{ c.titulo }}</td>

              <td class="p-4">
                <span class="badge-tipo"
                      [ngClass]="c.tipo === 'PDF' ? 'badge-pdf' : 'badge-img'">
                  <ion-icon [name]="c.tipo === 'PDF' ? 'document-text-outline' : 'image-outline'"></ion-icon>
                  {{ c.tipo }}
                </span>
              </td>

              <td class="p-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap"
                      [ngClass]="c.activo ? 'badge-activo' : 'badge-inactivo'">
                  <ion-icon [name]="c.activo ? 'checkmark-circle' : 'close-circle'" class="mr-1"></ion-icon>
                  {{ c.activo ? 'Activo' : 'Inactivo' }}
                </span>
              </td>

              <td class="p-4">
                <div class="flex justify-center gap-2">

                  <button (click)="editar(c)"
                    class="btn-primary flex items-center gap-2 whitespace-nowrap">
                    <ion-icon name="create-outline"></ion-icon>
                    Editar
                  </button>

                  <button *ngIf="c.activo; else activarBtn"
                    (click)="toggleStatus(c)"
                    class="btn-danger flex items-center gap-2 whitespace-nowrap">
                    <ion-icon name="ban-outline"></ion-icon>
                    Desactivar
                  </button>

                  <ng-template #activarBtn>
                    <button (click)="toggleStatus(c)"
                      class="btn-success flex items-center gap-2 whitespace-nowrap">
                      <ion-icon name="checkmark-outline"></ion-icon>
                      Activar
                    </button>
                  </ng-template>

                  <button (click)="delete(c)"
                    class="btn-danger flex items-center gap-2 whitespace-nowrap">
                    <ion-icon name="trash-outline"></ion-icon>
                    Eliminar
                  </button>

                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Vista Mobile / Tablet -->
      <div class="lg:hidden p-4 space-y-4">
        <div *ngFor="let c of calendars" class="user-card p-4">

          <div class="flex items-start justify-between mb-3 pb-3 border-b border-gray-200">
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-2">
                <span class="badge-tipo"
                      [ngClass]="c.tipo === 'PDF' ? 'badge-pdf' : 'badge-img'">
                  <ion-icon [name]="c.tipo === 'PDF' ? 'document-text-outline' : 'image-outline'"></ion-icon>
                  {{ c.tipo }}
                </span>
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold"
                      [ngClass]="c.activo ? 'badge-activo' : 'badge-inactivo'">
                  <ion-icon [name]="c.activo ? 'checkmark-circle' : 'close-circle'" class="mr-1"></ion-icon>
                  {{ c.activo ? 'Activo' : 'Inactivo' }}
                </span>
              </div>
              <h4 class="text-lg font-bold text-gray-800">{{ c.titulo }}</h4>
            </div>
          </div>

          <div class="flex gap-2 flex-wrap">
            <button (click)="editar(c)"
              class="btn-primary flex items-center gap-2 flex-1 justify-center">
              <ion-icon name="create-outline"></ion-icon>
              Editar
            </button>

            <button *ngIf="c.activo; else activarMobileBtn"
              (click)="toggleStatus(c)"
              class="btn-danger flex items-center gap-2 flex-1 justify-center">
              <ion-icon name="ban-outline"></ion-icon>
              Desactivar
            </button>

            <ng-template #activarMobileBtn>
              <button (click)="toggleStatus(c)"
                class="btn-success flex items-center gap-2 flex-1 justify-center">
                <ion-icon name="checkmark-outline"></ion-icon>
                Activar
              </button>
            </ng-template>

            <button (click)="delete(c)"
              class="btn-danger flex items-center gap-2 flex-1 justify-center">
              <ion-icon name="trash-outline"></ion-icon>
              Eliminar
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- ===== MODAL dentro de admin-content para heredar el CSS ===== -->
  <div *ngIf="mostrarModal"
       class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4"
       (click)="cerrarModal()">

    <div class="modal-content bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden"
         (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="modal-header flex items-center justify-between p-4 sm:p-6">
        <h3 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
          <ion-icon [name]="modoEdicion ? 'create-outline' : 'add-circle-outline'"></ion-icon>
          {{ modoEdicion ? 'Editar Calendario' : 'Nuevo Calendario' }}
        </h3>
        <button (click)="cerrarModal()" class="btn-close-modal">
          <ion-icon name="close-outline" class="text-2xl"></ion-icon>
        </button>
      </div>

      <!-- Body -->
      <div class="p-4 sm:p-6 space-y-5">

        <div>
          <label class="label-text">
            <ion-icon name="text-outline"></ion-icon>
            Título del Calendario
          </label>
          <input
            [(ngModel)]="titulo"
            type="text"
            placeholder="Ej: Calendario Escolar 2025"
            class="input-field"/>
        </div>

        <div>
          <label class="label-text">
            <ion-icon name="cloud-upload-outline"></ion-icon>
            Archivo (PDF o Imagen)
          </label>

          <label class="upload-zone" for="fileInput">
            <ion-icon name="document-attach-outline" class="upload-icon"></ion-icon>
            <span class="upload-nombre">
              {{ archivoNombre || 'Haz clic para seleccionar un archivo' }}
            </span>
            <span class="upload-hint">PDF, JPG, PNG, WEBP</span>
            <input
              id="fileInput"
              type="file"
              (change)="onFileChange($event)"
              accept=".pdf,image/*"
              class="hidden"/>
          </label>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer p-4 sm:p-6 flex flex-col sm:flex-row justify-end gap-2 sm:gap-3">
        <button (click)="cerrarModal()"
          class="btn-gray w-full sm:w-auto flex items-center justify-center gap-2">
          <ion-icon name="close-outline"></ion-icon>
          Cancelar
        </button>
        <button (click)="guardar()"
          class="btn-success w-full sm:w-auto flex items-center justify-center gap-2">
          <ion-icon [name]="modoEdicion ? 'save-outline' : 'add-circle-outline'"></ion-icon>
          {{ modoEdicion ? 'Guardar Cambios' : 'Crear Calendario' }}
        </button>
      </div>

    </div>
  </div>

</div>
