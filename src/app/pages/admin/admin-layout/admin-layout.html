<div class="admin-layout">
  <!-- Overlay para mobile -->
  <div 
    class="sidebar-overlay" 
    [class.active]="sidebarState === 'open' && isMobile"
    (click)="closeSidebar()">
  </div>

  <!-- Label flotante FIXED — fuera del sidebar, se mueve con JS -->
  <div 
    class="collapsed-label-fixed"
    [class.visible]="hoveredItemIndex >= 0 && sidebarState === 'collapsed'"
    [style.top.px]="labelTop">
    {{ hoveredItemIndex >= 0 ? menuItems[hoveredItemIndex].label : '' }}
  </div>

  <!-- Sidebar -->
  <aside 
    class="sidebar"
    [class.sidebar-open]="sidebarState === 'open'"
    [class.sidebar-collapsed]="sidebarState === 'collapsed'"
    [class.sidebar-hidden]="sidebarState === 'hidden'">
    
    <!-- Logo Section -->
    <div class="sidebar-header">
      <div class="logo-container" *ngIf="sidebarState === 'open'">
        <div class="logo-icon">
          <i class="ph ph-gear-six"></i>
        </div>
        <div class="logo-text">
          <h1>Panel Admin</h1>
        </div>
      </div>
      <div class="logo-icon-minimal" *ngIf="sidebarState === 'collapsed'">
        <i class="ph ph-gear-six"></i>
      </div>
      <div class="logo-icon-minimal hidden-state" *ngIf="sidebarState === 'hidden'">
        <i class="ph ph-gear-six"></i>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">

      <!-- COLLAPSED: SVG sidebar con escotaduras + items activos -->
      <ng-container *ngIf="sidebarState === 'collapsed'">
        <div class="collapsed-nav-wrapper">

          <!-- SVG de fondo azul con escotaduras dinámicas -->
          <svg class="collapsed-sidebar-svg"
               [attr.viewBox]="'0 0 80 ' + getCollapsedNavHeight()"
               xmlns="http://www.w3.org/2000/svg"
               [attr.height]="getCollapsedNavHeight()">
            <path [attr.d]="getCollapsedSidebarPath()" fill="#0288D1"/>
          </svg>

          <!-- Items -->
          <div class="collapsed-items">
            <div
              *ngFor="let item of menuItems; let i = index"
              class="collapsed-item"
              [class.collapsed-item-active]="isActiveRoute(item.route)"
              [routerLink]="item.route"
              (click)="onNavItemClick()"
              (mouseenter)="onItemMouseEnter($event, i)"
              (mouseleave)="onItemMouseLeave()">

              <!-- Forma activa -->
              <svg *ngIf="isActiveRoute(item.route)"
                   class="active-shape-svg"
                   viewBox="0 0 80 60"
                   xmlns="http://www.w3.org/2000/svg">
                <path d="M 40 0 A 30 30 0 0 0 40 60 L 80 60 L 80 0 Z" fill="#03A9F4"/>
              </svg>

              <!-- Ícono -->
              <div class="collapsed-icon" [class.collapsed-icon-active]="isActiveRoute(item.route)">
                <i [class]="'ph ' + item.icon"></i>
                <span class="nav-badge-dot" *ngIf="item.badge"></span>
              </div>
            </div>
          </div>

        </div>
      </ng-container>

      <!-- OPEN: items normales con texto -->
      <ng-container *ngIf="sidebarState !== 'collapsed'">
        <a 
          *ngFor="let item of menuItems"
          [routerLink]="item.route"
          routerLinkActive="active"
          class="nav-item"
          (click)="onNavItemClick()">
          <div class="nav-icon">
            <i [class]="'ph ' + item.icon"></i>
          </div>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
        </a>
      </ng-container>

    </nav>

    <!-- User Section -->
    <div class="sidebar-footer">
      <div class="user-section">
        <div class="user-avatar">
          <i class="ph ph-user"></i>
        </div>
        <div class="user-info">
          <p class="user-name">{{ currentUser?.nombre || 'Administrador' }}</p>
         
        </div>
      </div>
      <div class="footer-actions">
        <button (click)="logout()" class="footer-btn logout-btn" title="Cerrar sesión">
          <i class="ph ph-sign-out"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════
       MAIN CONTENT AREA
  ════════════════════════════════════════════ -->
  <div class="main-content" 
       [class.main-content-full]="sidebarState === 'hidden'"
       [class.main-content-collapsed]="sidebarState === 'collapsed'"
       [class.main-content-open]="sidebarState === 'open'">
    
    <!-- ══════════ TOPBAR MEJORADO ══════════ -->
    <header class="topbar">

      <!-- Lado izquierdo: toggle + breadcrumb / título de sección -->
      <div class="topbar-left">
        <!-- Botón de estado + selector flotante (aparece al pasar el puntero o al enfocar) -->
        <div class="sidebar-switch"
             [class.sidebar-switch--open]="stateMenuOpen"
             (pointerenter)="openStateMenu($event)"
             (pointerleave)="scheduleCloseStateMenu($event)"
             (focusin)="openStateMenu()"
             (focusout)="onStateMenuFocusOut($event)"
             (keydown.escape)="closeStateMenu()">
          <button class="toggle-btn" type="button" (click)="toggleSidebar()"
                  [title]="getToggleButtonTitle()" [attr.aria-label]="getToggleButtonTitle()">
            <i [class]="'ph ' + getToggleButtonIcon()"></i>
          </button>

          <div class="state-picker" role="group" aria-label="Estado del menú lateral">
            <button *ngFor="let option of stateOptions; let i = index"
                    type="button"
                    class="state-picker__option"
                    [class.state-picker__option--active]="sidebarState === option.state"
                    [style.--i]="i"
                    [title]="option.label"
                    [attr.aria-label]="option.label"
                    [attr.aria-pressed]="sidebarState === option.state"
                    [attr.tabindex]="stateMenuOpen ? 0 : -1"
                    (click)="setSidebarState(option.state, $event)">
              <i [class]="'ph ' + option.icon"></i>
            </button>
          </div>
        </div>

        <div class="topbar-divider"></div>

        <div class="topbar-section-info">
          <span class="topbar-section-label">Panel de administración</span>
        </div>
      </div>

      <!-- Lado derecho: acciones -->
      <div class="topbar-right">
        <!-- Perfil de usuario -->
        <button class="topbar-user-btn" (click)="goToProfile()" title="Mi perfil">
          <div class="topbar-user-avatar">
            <i class="ph ph-user"></i>
          </div>
          <div class="topbar-user-info">
            <span class="topbar-user-name">{{ currentUser?.nombre || 'Perfil' }}</span>
         
          </div>
         
        </button>

      </div>
    </header>
    <!-- ══════════ FIN TOPBAR ══════════ -->

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
